name: Assembled security verification
on:
  push:
    branches: [person-3]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest==9.1.1 ruff==0.17.5
      - run: python -m ruff check --isolated --target-version py312 --select E4,E7,E9,F --no-cache redteam
      - run: python -m pytest -q -ra -p no:cacheprovider redteam/tests/test_framework.py
      - name: Existing application regression tests
        run: python -m pytest -q -ra -p no:cacheprovider tests
      - name: Execute cases (2 means explicitly blocked, never all-passed)
        run: python -c "from redteam.runner import run; code=run('security-report.json'); raise SystemExit(0 if code in (0,2) else code)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-${{ matrix.os }}
          path: security-report.json
          if-no-files-found: error
