[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crocodile"
version = "0.1.0"
description = "Token-efficient terminal coding agent: more correct work per token."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "tiktoken>=0.7"]

[project.scripts]
crocodile = "crocodile.cli:app"
crock = "crocodile.cli:app"

[tool.setuptools.packages.find]
include = ["crocodile*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]
